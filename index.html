<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>晶片懸案</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕵️</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
  :root{
    --ground:#140e22; --panel:#211733; --panel2:#2b1f41; --line:rgba(255,255,255,.12);
    --text:#f6f1ea; --muted:rgba(246,241,234,.62);
    --accent:#ffb35c; --hot:#ff8a5c; --green:#6fdca0; --red:#ff5c6c;
    --paper:#f4ead6; --paperInk:#2a2118; --paperLine:#d8c8a8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overscroll-behavior:none}
  body{
    background:radial-gradient(120% 90% at 50% -10%,#3a2752 0%,var(--ground) 62%);
    color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    display:grid;grid-template-rows:auto minmax(0,1fr);height:100dvh;overflow:hidden;
    touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  button{font:inherit;cursor:pointer;color:inherit}
  [hidden]{display:none!important}

  /* ── 頂部 ── */
  .top{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line)}
  .brand{font-weight:900;font-size:clamp(17px,2vw,22px);letter-spacing:.06em;white-space:nowrap}
  .group{color:var(--muted);font-size:15px;white-space:nowrap}
  .group b{color:var(--accent)}
  .pips{display:flex;gap:6px;margin:0 auto}
  .pip{padding:4px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:14px;color:var(--muted);white-space:nowrap}
  .pip.done{color:var(--green);border-color:rgba(111,220,160,.4)}
  .pip.now{color:#1c1526;background:var(--accent);border-color:var(--accent);font-weight:900}
  .hintbtn{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:6px 16px;font-weight:700;white-space:nowrap}

  /* ── 版面：左邊故事、右邊動手 ── */
  main{min-height:0;overflow:hidden}
  .stage{height:100%;display:grid;grid-template-columns:minmax(280px,34%) minmax(0,1fr);gap:18px;padding:14px 16px 16px}
  .story{min-height:0;overflow:auto;padding-right:4px;display:flex;flex-direction:column;gap:12px}
  .story h2{margin:0;font-size:clamp(22px,2.6vw,28px)}
  .story p{margin:0;line-height:1.7;font-size:16px;color:rgba(246,241,234,.86)}
  .story .task{background:var(--panel);border-left:4px solid var(--accent);padding:10px 12px;border-radius:0 10px 10px 0}
  .story .task b{color:var(--accent)}
  .work{min-height:0;display:flex;flex-direction:column;gap:12px;position:relative}

  .clue{background:var(--paper);color:var(--paperInk);border-radius:12px;padding:12px 14px;box-shadow:0 6px 18px rgba(0,0,0,.35);transform:rotate(-.6deg)}
  .clue .tag{display:inline-block;font-size:12px;font-weight:900;letter-spacing:.1em;color:#8a5a12;margin-bottom:4px}
  .clue p{color:var(--paperInk);font-weight:700}

  .btn{border:0;border-radius:999px;background:var(--accent);color:#1c1526;font-weight:900;font-size:18px;padding:12px 26px;min-height:50px}
  .btn:disabled{opacity:.4}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:700;font-size:16px}
  .btn.small{font-size:15px;padding:8px 16px;min-height:40px}

  .q{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
  .q h3{margin:0 0 8px;font-size:17px}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px 12px;font-size:16px;line-height:1.5}
  .opt.wrong{border-color:var(--red);opacity:.6}
  .opt.right{border-color:var(--green);background:#1d3a2c}
  .opt.maybe{border-color:#ffd166}
  .fb{margin-top:8px;font-size:15px;line-height:1.6;color:#ffd166;min-height:0}
  .fb.ok{color:var(--green)}
  .q textarea{width:100%;margin-top:8px;font:inherit;font-size:15px;border-radius:10px;border:1px solid var(--line);background:#160f22;color:var(--text);padding:8px;resize:none;-webkit-user-select:text;user-select:text}
  .next{background:linear-gradient(135deg,#3a2a1c,#2b1f41);border:1px solid var(--accent);border-radius:14px;padding:12px 14px}
  .next p{margin:0 0 10px}
  .next b{color:var(--accent)}
  .big{font-size:1.25em;font-weight:900;color:var(--accent)}

  /* ── 晶片圖 ── */
  .chip{position:relative;flex:none;border-radius:10px;overflow:hidden;background:#000;box-shadow:0 8px 30px rgba(0,0,0,.45)}
  .chip img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
  .chip svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .chip .zoomer{position:absolute;inset:0;transition:transform 1.4s cubic-bezier(.5,0,.2,1),filter .6s}
  .chip .cover{opacity:0;transition:opacity .8s}
  .chip .cover.show{opacity:1}
  .chip .cap{position:absolute;left:8px;top:8px;padding:3px 10px;border-radius:999px;background:rgba(20,14,34,.85);font-size:13px;font-weight:700}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  .flash.go{animation:flash .5s}
  @keyframes flash{0%{opacity:.9}100%{opacity:0}}
  .ring{fill:none;stroke:var(--red);stroke-width:4}
  .found{fill:none;stroke:var(--green);stroke-width:4}
  .miss{stroke:var(--red);stroke-width:3;stroke-linecap:round;animation:fade 1s forwards}
  @keyframes fade{70%{opacity:1}100%{opacity:0}}
  .center{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:14px}
  .tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .tool{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 14px;font-size:16px;font-weight:700;min-height:52px}
  .tool.used{opacity:.55}

  /* ── 開場：證物與原因 ── */
  .evs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .ev{position:relative;text-align:left;background:var(--paper);color:var(--paperInk);border:3px solid transparent;border-radius:10px;padding:8px 10px;font-size:14px;line-height:1.5;box-shadow:0 4px 12px rgba(0,0,0,.3)}
  .ev .no{font-size:11px;font-weight:900;letter-spacing:.1em;color:#8a5a12}
  .ev .t{font-weight:900;font-size:15px;margin:2px 0}
  .ev .k{font-weight:900;color:#b03a1e}
  .ev.sel{border-color:var(--accent);transform:translateY(-3px)}
  .ev.placed{display:none}
  .bars{display:flex;gap:3px;align-items:flex-end;height:30px;margin-top:4px}
  .bars i{flex:1;background:#b03a1e;border-radius:2px 2px 0 0;min-height:2px;position:relative}
  .bars i span{position:absolute;bottom:-14px;left:0;right:0;text-align:center;font-size:9px;font-style:normal;color:#6b5b45}
  .causes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .cause{text-align:left;min-height:96px;border:2px dashed var(--line);background:var(--panel);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
  .cause .ct{font-weight:900;font-size:16px}
  .cause.ready{border-color:var(--accent)}
  .cause.ok{border-style:solid;border-color:var(--green)}
  .cause.out{opacity:.4;text-decoration:line-through}
  .ptag{align-self:flex-start;background:var(--paper);color:var(--paperInk);border-radius:8px;padding:2px 8px;font-size:13px;font-weight:700;border:0}
  .ptag.bad{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  /* ── 關卡二：比對 ── */
  .pair{display:flex;gap:12px;align-items:flex-start;justify-content:center}
  .pair .lbl{text-align:center;font-size:14px;color:var(--muted);margin-bottom:4px}
  .blink{user-select:none;-webkit-user-select:none;touch-action:none}
  .status{display:flex;gap:14px;align-items:center;justify-content:center;font-size:16px;color:var(--muted)}
  .status b{color:var(--text);font-size:1.2em}
  .cmp{display:flex;flex-direction:column;gap:8px;margin-top:4px}
  .cmp .row{display:grid;grid-template-columns:7em 1fr 4em;gap:8px;align-items:center;font-size:15px}
  .cmp .bar{height:16px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
  .cmp .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--hot))}
  .lock{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,14,34,.7);border-radius:10px;font-weight:700;color:var(--muted);text-align:center;padding:10px}

  /* ── 關卡三：生產線、電腦 ── */
  .belt{position:relative;height:232px;border-radius:14px;background:repeating-linear-gradient(90deg,#2a2236 0 40px,#241d30 40px 80px);border:1px solid var(--line);overflow:hidden}
  .belt .item{position:absolute;top:30px;width:110px;height:172px;border-radius:6px;background:#000;box-shadow:0 4px 10px rgba(0,0,0,.5);border:0;padding:0;overflow:visible}
  .belt .item .pic{position:absolute;inset:0;border-radius:6px;background:center/cover no-repeat;pointer-events:none}
  .belt .item.hit{outline:4px solid var(--green)}
  .belt .item.wrongtap{outline:4px solid var(--red)}
  .belt .item.flag::after{content:"";position:absolute;inset:-4px;border:4px solid var(--red);border-radius:8px}
  .beltinfo{display:flex;gap:10px;flex-wrap:wrap}
  .beltinfo div{flex:1;min-width:140px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px;color:var(--muted)}
  .beltinfo b{display:block;font-size:24px;color:var(--text);font-variant-numeric:tabular-nums}
  .cards{display:flex;gap:8px;flex-wrap:wrap}
  .card{background:var(--paper);color:var(--paperInk);border:3px solid transparent;border-radius:10px;padding:8px 12px;font-weight:700;font-size:15px}
  .card.sel{border-color:var(--accent)}
  .card.used{opacity:.35}
  .slots{display:flex;gap:10px;align-items:stretch}
  .slot{flex:1;min-height:70px;border:2px dashed var(--line);border-radius:12px;padding:8px;background:var(--panel);text-align:left;display:flex;flex-direction:column;gap:6px}
  .slot .st{font-size:13px;color:var(--muted)}
  .slot.ready{border-color:var(--accent)}
  .slot .card{align-self:flex-start}
  .computer{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:start}
  .computer figure{margin:0;text-align:center}
  .computer canvas{width:100%;height:auto;border-radius:8px;background:#000;display:block}
  .computer figcaption{font-size:13px;color:var(--muted);margin-top:4px}
  .minus{align-self:center;font-size:28px;font-weight:900;color:var(--muted)}

  /* ── 結案報告 ── */
  .flow{display:flex;flex-direction:column;gap:8px}
  .fslot{display:flex;align-items:center;gap:10px;min-height:52px;border:2px dashed var(--line);border-radius:12px;padding:6px 10px;background:var(--panel);text-align:left;font-size:16px}
  .fslot .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-weight:900;flex:none}
  .fslot.filled{border-style:solid;border-color:var(--accent)}
  .fslot.bad{border-color:var(--red)}
  .pool{display:flex;flex-wrap:wrap;gap:8px}
  .step{background:var(--paper);color:var(--paperInk);border:0;border-radius:10px;padding:8px 12px;font-size:15px;font-weight:700;text-align:left}
  .match{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;font-size:15px}
  .match .seg{display:flex;gap:6px}
  .match .seg button{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:6px 12px;font-size:14px}
  .match .seg button.on{background:var(--accent);color:#1c1526;border-color:var(--accent);font-weight:900}

  /* ── 覆蓋卡片 ── */
  #overlay{position:fixed;inset:0;z-index:50;background:rgba(14,10,24,.86);display:grid;place-items:center;padding:16px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  .card2{width:min(520px,100%);max-height:100%;overflow:auto;background:#241a33;border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:26px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.5)}
  .card2 h2{margin:0 0 10px;font-size:clamp(22px,3vw,30px)}
  .card2 p{margin:8px 0;color:rgba(246,241,234,.8);font-size:16px;line-height:1.7}
  .card2 .err{color:#ff8f80;min-height:1.4em}
  .card2 input{width:100%;font:inherit;font-size:24px;text-align:center;padding:12px;border-radius:14px;border:2px solid rgba(255,255,255,.2);background:#160f22;color:#fff;-webkit-user-select:text;user-select:text}
  .card2 input:focus{outline:none;border-color:var(--accent)}
  .card2 .btn{width:100%;margin-top:14px}
  .card2 .hint{text-align:left;background:var(--paper);color:var(--paperInk);border-radius:12px;padding:12px 14px;font-weight:700;line-height:1.7;margin-top:10px}
  .dots{display:flex;gap:8px;justify-content:center;margin-top:16px}
  .dots i{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:dot 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
  @keyframes dot{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}

  @media (max-width:820px){
    body{overflow:auto;height:auto;min-height:100dvh}
    main{overflow:visible}
    .stage{grid-template-columns:1fr;height:auto}
    .pips{display:none}
    .evs{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand">🕵️ 晶片懸案</div>
  <div class="group" id="groupName" hidden></div>
  <div class="pips" id="pips"></div>
  <button class="hintbtn" id="hintBtn" hidden>💡 提示</button>
</header>
<main id="app"></main>
<div id="overlay"><div class="card2" id="ov"><h2>載入中…</h2></div></div>

<script type="module">
import * as db from "./db.js";
import { W, H, CHIP6, CASE_CHIPS, STANDARD, FACTORY_PER_HOUR, PHOTOS_PER_CHIP, STAGES, CAUSES, HINTS, hitTest, defectCircle } from "./data.js";

const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const svgEl = (t, a) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const params = new URLSearchParams(location.search);
const CODE = /^\d{4}$/.test(params.get("case") || "") ? params.get("case") : null;

let uid = null, me = null, meta = null, stage = 0, stageStart = Date.now();
const gpath = () => `cases/${CODE}/groups/${uid}`;
const save = patch => db.update(gpath(), { ...patch, t: Math.round(db.serverNow()) }).catch(e => console.warn(e));

// ── 覆蓋卡片 ──
const ov = html => { $("ov").innerHTML = html; $("overlay").hidden = false; };
const hideOv = () => { $("overlay").hidden = true; };

// ── 頂部進度 ──
function renderTop() {
  $("pips").innerHTML = STAGES.map((s, i) => `<span class="pip ${i < stage ? "done" : i === stage ? "now" : ""}">${i < stage ? "✓ " : ""}${s}</span>`).join("");
  $("hintBtn").hidden = !(meta && meta.state === "open" && stage < STAGES.length);
}

// ── 提示 ──
let hintLevel = 0;
$("hintBtn").onclick = () => {
  const hs = HINTS[stage] || [];
  const show = () => {
    ov(`<h2>💡 提示</h2>${hs.slice(0, hintLevel).map(h => `<div class="hint">${h}</div>`).join("")}
      ${hintLevel < hs.length ? `<button class="btn ghost" id="more">${hintLevel ? "再給一個提示" : "看提示"}</button>` : ""}
      <button class="btn" id="close">回到案件</button>`);
    if ($("more")) $("more").onclick = () => { hintLevel++; save({ [`hints/s${stage}`]: hintLevel }); show(); };
    $("close").onclick = hideOv;
  };
  if (!hintLevel) { hintLevel = 1; save({ [`hints/s${stage}`]: 1 }); }
  show();
};

// ── 換關 ──
function goStage(s, record = true) {
  if (record && s > stage) save({ stage: s, [`times/s${stage}`]: Date.now() - stageStart });
  stage = s; stageStart = Date.now(); hintLevel = (me && me.hints && me.hints[`s${s}`]) || 0;
  renderTop();
  [stage0, stage1, stage2, stage3, stage4, done][Math.min(s, 5)]();
}

// ── 共用：選擇題 ──
// opts: [{text, ok, fb}]；回答對了呼叫 onDone。每次選擇都記下來（老師端看得到試錯過程）。
function question(box, key, title, opts, onDone, withText) {
  const tries = [];
  box.innerHTML = `<div class="q"><h3>${title}</h3><div class="opts">${opts.map((o, i) =>
    `<button class="opt" data-i="${i}">${String.fromCharCode(65 + i)}. ${o.text}</button>`).join("")}</div>
    <div class="fb" id="fb-${key}"></div>
    ${withText ? `<textarea id="tx-${key}" rows="2" maxlength="120" placeholder="（可以不寫）用你們自己的話補一句："></textarea>` : ""}
    </div>`;
  box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const o = opts[+b.dataset.i];
    tries.push(String.fromCharCode(65 + +b.dataset.i));
    save({ [`ans/${key}`]: tries.join(">") });
    const fb = $("fb-" + key);
    fb.textContent = o.fb || ""; fb.className = "fb" + (o.ok ? " ok" : "");
    if (!o.ok) { b.classList.add(o.soft ? "maybe" : "wrong"); return; } // soft：有道理但還不夠，用黃色不用紅色
    b.classList.add("right");
    box.querySelectorAll(".opt").forEach(x => x.disabled = true);
    if (withText) {
      const tx = $("tx-" + key);
      const go = document.createElement("button");
      go.className = "btn small"; go.textContent = "確定"; go.style.marginTop = "8px";
      go.onclick = () => { if (tx.value.trim()) save({ [`ans/${key}t`]: tx.value.trim().slice(0, 120) }); tx.disabled = true; go.remove(); onDone(); };
      box.querySelector(".q").appendChild(go);
    } else onDone();
  });
}

// ── 共用：把晶片圖放進框裡 ──
function fitChip(el, maxW, maxH) {
  const w = Math.max(80, Math.min(maxW, maxH * W / H));
  el.style.width = w + "px"; el.style.height = w * H / W + "px";
}
const evd = () => meta.evidence || {};
const avgSec = () => evd().avgSec || 10;

// ════════════ 開場：案件 ════════════
function stage0() {
  const e = evd(), notSeen = String(e.notSeen || "").split(",").map(Number);
  const maxNS = Math.max(1, ...notSeen);
  const EVS = [
    { id: 1, cause: "small", t: "第 6 張的檢測紀錄", b: `全班 <span class="k">${e.n}</span> 人檢查第 6 張，找到瑕疵的有 <span class="k">${e.chip6Found}</span> 人。<br>可是它真的是壞的。`,
      fb: "第 6 張大家都看了，卻幾乎沒人找到。是來不及看，還是根本看不到？" },
    { id: 2, cause: "small", t: "瑕疵有多小？", b: "晶片上常見的瑕疵大約 <span class=\"k\">30 奈米</span>，比頭髮細 3000 倍，比病毒還小。",
      fb: "這份證物在說瑕疵的大小，跟哪個原因有關？" },
    { id: 3, cause: "many", t: "時間到了還沒看完", b: `<span class="k">${e.notFinished}</span> 人還沒看完 6 張就時間到了。沒看到各張的人數：
      <div class="bars">${notSeen.map((v, i) => `<i style="height:${Math.round(v / maxNS * 100)}%"><span>${i + 1}</span></i>`).join("")}</div><br>`,
      fb: "這份證物在說「時間不夠、看不完」，跟哪個原因有關？" },
    { id: 4, cause: "many", t: "每張花了多少時間", b: `平均每張看 <span class="k">${e.avgSec} 秒</span>，${e.seconds} 秒只夠看大約 <span class="k">${Math.max(1, Math.floor(e.seconds / (e.avgSec || 10)))} 張</span>。`,
      fb: "這份證物在說「看得快不快」，跟哪個原因有關？" },

// ════════════ 線索三：看不完的晶片 ════════════
function stage3() {
  $("app").innerHTML = `<section class="stage">
    <div class="story">
      <h2>線索三：看不完的晶片</h2>
      <p>第三條線索：<b>太多了。</b>先試試看，你們跟不跟得上工廠的生產線。</p>
      <p>晶片會從右邊送過來。<b>看到有瑕疵（灰塵、裂痕、污漬）的壞晶片就點它</b>，好的晶片不要點。</p>
      <div id="p1"><button class="btn" id="startBelt">開始生產線（20 秒）</button></div>
      <div id="p2"></div>
      <div id="why"></div>
      <div id="nextbox"></div>
    </div>
    <div class="work" id="work">
      <div class="belt" id="belt"></div>
      <div class="beltinfo">
        <div>工廠需要的速度<b>每秒 ${(FACTORY_PER_HOUR / 3600).toFixed(1)} 顆</b></div>
        <div>現在的速度<b id="speed">—</b></div>
        <div>抓到的壞晶片<b id="caught">0</b></div>
        <div>漏掉的壞晶片<b id="missed">0</b></div>
      </div>
      <div id="computer" hidden></div>
    </div></section>`;

  // ── 生產線 ──
  const BELT_BAD = ["1", "2", "4", "A", "B", "C"]; // img/belt-*.jpg：第一個遊戲的壞晶片和線索二的新晶片縮小版
  let items = [], raf = 0, caught = 0, missed = 0, wrongTaps = 0, auto = false;
  const belt = $("belt");
  function spawn() {
    // 壞晶片用真的瑕疵圖縮小顯示（瑕疵變成小點、細線，要仔細看才看得到）；
    // 每張隨機翻轉，學生沒辦法靠記哪一張是壞的
    const bad = Math.random() < 0.45;
    const el = document.createElement("button");
    el.className = "item";
    const pic = document.createElement("div");
    pic.className = "pic";
    pic.style.backgroundImage = `url(img/belt-${bad ? BELT_BAD[Math.floor(Math.random() * BELT_BAD.length)] : "good"}.jpg)`;
    pic.style.transform = ["none", "scaleX(-1)", "scaleY(-1)", "rotate(180deg)"][Math.floor(Math.random() * 4)];
    el.appendChild(pic);
    // 一出現就在輸送帶最右邊（看得到），之後往左走
    const it = { el, bad, x: Math.max(0, belt.clientWidth - 116), done: false };
    el.style.transform = `translateX(${it.x}px)`;
    el.onpointerdown = e => {
      e.preventDefault();
      if (it.done || auto) return;
      it.done = true;
      if (bad) { caught++; el.classList.add("hit"); } else { wrongTaps++; el.classList.add("wrongtap"); }
      upd();
    };
    belt.appendChild(el); items.push(it);
    if (auto && bad) { it.done = true; caught++; el.classList.add("flag"); }
  }
  const upd = () => { $("caught").textContent = auto ? caught.toLocaleString() : caught; $("missed").textContent = missed; };
  function run(seconds, rateAt, onEnd) {
    items.forEach(i => i.el.remove()); items = []; caught = 0; missed = 0; wrongTaps = 0; upd();
    let t0 = performance.now(), last = t0, acc = 1;   // acc 從 1 開始：一按開始就先送進第一顆
    const loop = now => {
      // 分頁在背景時瀏覽器會暫停動畫，回來時不要讓晶片一下子跳走
      const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
      // 第一格動畫的時間戳記可能比 t0 還早一點：不能讓經過時間變成負的，
      // 不然 (負數) ** 1.6 會變成 NaN，之後累計永遠是 NaN，晶片就一顆都送不出來
      const t = Math.max(0, (now - t0) / 1000);
      const rate = rateAt(t);                     // 每秒送進來幾顆
      if (!Number.isFinite(acc)) acc = 0;
      $("speed").textContent = `每秒 ${rate.toFixed(1)} 顆`;
      acc += rate * dt;
      while (acc >= 1) { spawn(); acc -= 1; }
      const v = Math.max(140, rate * 125);      // 輸送帶速度（畫面上每秒幾個像素），讓晶片之間留一點間隔
      for (const it of items) { it.x -= v * dt; it.el.style.transform = `translateX(${it.x}px)`; }
      items = items.filter(it => {
        if (it.x > -120) return true;
        if (it.bad && !it.done) missed++;
        it.el.remove(); return false;
      });
      upd();
      if (t < seconds) raf = requestAnimationFrame(loop); else onEnd();
    };
    raf = requestAnimationFrame(loop);
  }
  $("startBelt").onclick = () => {
    $("p1").innerHTML = `<p>生產線運轉中……</p>`;
    // 從每 1.2 秒一顆，慢慢加速到工廠需要的每秒 8 顆以上
    run(20, t => 0.8 + (FACTORY_PER_HOUR / 3600 - 0.8) * Math.min(1, (t / 20) ** 1.6), () => {
      items.forEach(i => i.el.remove()); items = [];
      me.ans = { ...(me.ans || {}), belt: `${caught}/${caught + missed}` }; save({ "ans/belt": me.ans.belt });
      $("p1").innerHTML = `<div class="q"><h3>生產線結果</h3><p>抓到 <b>${caught}</b> 顆壞晶片，漏掉 <b>${missed}</b> 顆${wrongTaps ? `，還把 ${wrongTaps} 顆好的點掉了` : ""}。</p>
        <p>這還只是 20 秒。工廠要每秒 ${(FACTORY_PER_HOUR / 3600).toFixed(1)} 顆，一整天都不能停……</p></div>`;
      showComputer();
    });
  };

  // ── 設定檢測電腦 ──
  function showComputer() {
    $("p2").innerHTML = `<div class="clue"><div class="tag">線索卡</div><p>什麼東西做重複的事情，又快又準，而且永遠不會累？</p></div>
      <p style="margin-top:12px">檢測室有一台電腦，可以自動比對兩張圖。但要先告訴它：<b>要比什麼跟什麼？</b>點一張卡片，再點右邊的格子把它放進去，然後按「開始比對」。我們先用它來檢查<b>第 6 張</b>。</p>`;
    $("belt").hidden = true; document.querySelector(".beltinfo").hidden = true;
    const CARDS = [
      { id: "plain", t: "📷 一般相機拍的第 6 張照片" },
      { id: "zoom", t: "🔬 放大拍下的第 6 張照片" },
      { id: "std", t: "📐 標準電路圖" },
      { id: "eye", t: "👀 檢測員的眼睛" },
    ];
    $("computer").hidden = false;
    $("computer").innerHTML = `<div class="cards" id="cards">${CARDS.map(c => `<button class="card" data-id="${c.id}">${c.t}</button>`).join("")}</div>
      <div class="slots" id="slots">
        <div class="slot" data-s="a" role="button"><span class="st">要檢查的照片</span><div class="in"></div></div>
        <div class="slot" data-s="b" role="button"><span class="st">拿來比對的標準</span><div class="in"></div></div>
        <button class="btn" id="run" disabled>開始比對 ▶</button>
      </div>
      <div class="fb" id="cfb"></div>
      <div class="computer" id="out" hidden>
        <figure><canvas id="cA"></canvas><figcaption>要檢查的照片</figcaption></figure>
        <figure><canvas id="cB"></canvas><figcaption id="capB">標準電路圖</figcaption></figure>
        <figure><canvas id="cD"></canvas><figcaption>電腦相減的結果<br>一樣＝黑、不一樣＝亮</figcaption></figure>
      </div>`;
    const slot = { a: null, b: null };
    let sel = null;
    const refresh = () => {
      document.querySelectorAll("#cards .card").forEach(b => { b.classList.toggle("sel", b.dataset.id === sel); b.classList.toggle("used", Object.values(slot).includes(b.dataset.id)); });
      document.querySelectorAll(".slot").forEach(s => {
        s.classList.toggle("ready", !!sel);
        const c = CARDS.find(x => x.id === slot[s.dataset.s]);
        s.querySelector(".in").innerHTML = c ? `<span class="card">${c.t}</span>` : "";
      });
      $("run").disabled = !(slot.a && slot.b);
    };
    $("cards").onclick = e => { const b = e.target.closest(".card"); if (!b || b.classList.contains("used")) return; sel = sel === b.dataset.id ? null : b.dataset.id; refresh(); };
    $("slots").onclick = e => {
      const s = e.target.closest(".slot"); if (!s) return;
      if (sel) { slot[s.dataset.s] = sel; sel = null; } else slot[s.dataset.s] = null;
      refresh();
    };
    const tries = [];
    $("run").onclick = async () => {
      const fb = $("cfb"); fb.className = "fb";
      tries.push(`${slot.a}+${slot.b}`); save({ "ans/computer": tries.join(">") });
      if (slot.a === "eye" || slot.b === "eye") { fb.textContent = "眼睛沒辦法放進電腦裡喔！電腦只能比對照片。"; return; }
      if (slot.a === "std") { fb.textContent = "要檢查的是工廠做出來的晶片，不是標準圖。"; return; }
      if (slot.b !== "std") { fb.textContent = "拿來比對的，要是「一定不會錯」的標準答案。"; return; }
      fb.textContent = "電腦比對中……";
      const zoom = slot.a === "zoom";
      const n = await compare(zoom ? CHIP6.closeup : CHIP6.img, zoom ? CHIP6.closeupStd : STANDARD, zoom);
      if (!zoom) { fb.textContent = "電腦什麼都沒找到！照片上根本沒拍到那顆灰塵，電腦再厲害也比不出來。要換哪一張照片？"; return; }
      fb.className = "fb ok";
      fb.textContent = `找到了！電腦把兩張圖每一點的亮度相減，只有灰塵那裡不一樣，所以亮起來了。（找到 ${n} 處不一樣）`;
      $("run").disabled = true; $("cards").onclick = $("slots").onclick = null;
      question($("why"), "why3", "為什麼要交給電腦，不用人來比？", [
        { text: "數量太多，人太慢、會累、會看漏；電腦又快又不會累", ok: true, fb: "沒錯！重複又大量的比對，正是電腦最擅長的事。" },
        { text: "電腦比人聰明，什麼都知道", fb: "電腦其實只是在做「兩張圖相減」這件很單純的事。它厲害的地方是什麼？" },
        { text: "電腦不用放大照片也看得到灰塵", fb: "剛剛把一般相機的照片給電腦，它有找到嗎？" },
      ], finale, true);
      $("why").scrollIntoView({ behavior: "smooth" });
    };
    refresh();
  }

  // 把兩張圖逐點相減，畫出結果；回傳找到幾處不一樣
  async function compare(srcA, srcB, zoomed) {
    $("out").hidden = false;
    const load = s => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = s; });
    const [a, b] = await Promise.all([load(srcA), load(srcB)]);
    // 一般照片：只取第 6 張灰塵附近那一塊來比，畫面才看得清楚
    const crop = zoomed ? [0, 0, a.width, a.height] : [CHIP6.zoom.x - 40, CHIP6.zoom.y - 62, 80, 125];
    const w = 240, h = Math.round(w * crop[3] / crop[2]);
    const draw = (id, img) => { const c = $(id); c.width = w; c.height = h; const g = c.getContext("2d"); g.imageSmoothingEnabled = !zoomed ? false : true; g.drawImage(img, ...crop, 0, 0, w, h); return g; };
    $("capB").textContent = zoomed ? "標準電路圖（同一個位置、同樣放大）" : "標準電路圖（同一個位置）";
    const ga = draw("cA", a), gb = draw("cB", b);
    const da = ga.getImageData(0, 0, w, h), dbb = gb.getImageData(0, 0, w, h);
    const cd = $("cD"); cd.width = w; cd.height = h; const gd = cd.getContext("2d");
    const out = gd.createImageData(w, h);
    let hits = 0, sx = 0, sy = 0;
    for (let i = 0; i < da.data.length; i += 4) {
      const diff = (Math.abs(da.data[i] - dbb.data[i]) + Math.abs(da.data[i + 1] - dbb.data[i + 1]) + Math.abs(da.data[i + 2] - dbb.data[i + 2])) / 3;
      const v = diff > 25 ? 255 : 0;
      out.data[i] = v; out.data[i + 1] = v; out.data[i + 2] = v; out.data[i + 3] = 255;
      if (v) { hits++; const p = i / 4; sx += p % w; sy += Math.floor(p / w); }
    }
    // 由上往下掃描，看起來像電腦一行一行在比
    for (let y = 0; y <= h; y += 6) {
      gd.putImageData(out, 0, 0, 0, 0, w, y);
      await sleep(16);
    }
    if (hits > 20) {
      gd.strokeStyle = "#ff5c6c"; gd.lineWidth = 3;
      gd.beginPath(); gd.arc(sx / hits, sy / hits, 26, 0, Math.PI * 2); gd.stroke();
      return 1;
    }
    return 0;
  }

  // ── 交給電腦之後的生產線 ──
  function finale() {
    $("computer").hidden = true; $("belt").hidden = false; document.querySelector(".beltinfo").hidden = false;
    auto = true;
    $("p2").insertAdjacentHTML("beforeend", `<div class="next" id="autoNote"><p>把電腦裝上生產線，用<b>放大拍下的照片</b>跟<b>標準電路圖</b>比對……</p></div>`);
    run(6, () => FACTORY_PER_HOUR / 3600 * 1.2, () => {
      $("caught").textContent = "✔";
      $("nextbox").innerHTML = `<div class="next"><p>電腦跟上了！工廠的速度每秒 ${(FACTORY_PER_HOUR / 3600).toFixed(1)} 顆，電腦一顆都沒漏。</p>
        <p>三條線索都追完了，該寫結案報告了。</p><button class="btn" id="go">寫結案報告 →</button></div>`;
      $("go").onclick = () => goStage(4);
      $("nextbox").scrollIntoView({ behavior: "smooth" });
    });
  }
}

// ════════════ 結案報告 ════════════
function stage4() {
  const STEPS = [
    { id: 1, t: "每蓋完一層電路" },
    { id: 2, t: "用高倍鏡頭的相機，把表面放大拍下來" },
    { id: 3, t: "讓電腦把照片跟標準電路圖逐點比對" },
    { id: 4, t: "標出不一樣的地方，把壞晶片挑掉，再蓋下一層" },
    { id: 5, t: "請檢測員用眼睛再檢查一次", fb: "開場的證物說，人的眼睛有兩個過不去的難題。" },
    { id: 6, t: "等整顆晶片都做完，再一起檢查", fb: "如果某一層壞了又被下一層蓋住，就修不好了。要在什麼時候檢查？" },
  ];
  const order = [4, 1, 6, 3, 5, 2].map(id => STEPS.find(s => s.id === id)); // 打亂的順序
  $("app").innerHTML = `<section class="stage">
    <div class="story">
      <h2>結案報告</h2>
      <p>把你們找到的方法，寫成工廠以後可以照著做的<b>檢測流程</b>。</p>
      <p>點下面的步驟，依照順序放進流程裡；點流程裡的步驟可以拿回來。有兩張步驟是用不到的。</p>
      <div id="msg"></div>
    </div>
    <div class="work" style="overflow:auto">
      <div class="flow" id="flow">${[0, 1, 2, 3].map(i => `<button class="fslot" data-i="${i}"><span class="n">${i + 1}</span><span class="tx"></span></button>`).join("")}</div>
      <div class="pool" id="pool"></div>
      <div><button class="btn" id="check" disabled>檢查流程</button></div>
      <div id="match"></div>
    </div></section>`;
  const slots = [null, null, null, null];
  const refresh = () => {
    document.querySelectorAll(".fslot").forEach((b, i) => { b.classList.toggle("filled", !!slots[i]); b.classList.remove("bad"); b.querySelector(".tx").textContent = slots[i] ? slots[i].t : ""; });
    $("pool").innerHTML = order.filter(s => !slots.includes(s)).map(s => `<button class="step" data-id="${s.id}">${s.t}</button>`).join("");
    $("check").disabled = slots.some(s => !s);
  };
  $("pool").onclick = e => { const b = e.target.closest(".step"); if (!b) return; const i = slots.indexOf(null); if (i < 0) return; slots[i] = STEPS.find(s => s.id === +b.dataset.id); refresh(); };
  $("flow").onclick = e => { const b = e.target.closest(".fslot"); if (!b || $("check").hidden) return; slots[+b.dataset.i] = null; refresh(); };
  const tries = [];
  $("check").onclick = () => {
    tries.push(slots.map(s => s.id).join(""));
    save({ "ans/report": tries.join(">") });
    const bad = slots.findIndex((s, i) => s.id !== i + 1);
    if (bad >= 0) {
      const s = slots[bad];
      document.querySelectorAll(".fslot")[bad].classList.add("bad");
      $("msg").innerHTML = `<div class="q"><h3>第 ${bad + 1} 步好像不對</h3><p>${s.fb || "想想看每一步需要前一步給它什麼：電腦要比對，得先有照片；要挑掉壞晶片，得先知道哪裡不一樣。"}</p></div>`;
      return;
    }
    $("check").hidden = true; $("pool").hidden = true;
    $("msg").innerHTML = `<div class="next"><p>流程正確！最後一步：每個步驟解決了開場的哪一個難題？</p></div>`;
    const ROWS = [{ id: 2, ok: "small" }, { id: 3, ok: "many" }];
    const pick = {};
    $("match").innerHTML = `<div class="q"><div class="match">${ROWS.map(r => `<span>${STEPS.find(s => s.id === r.id).t}</span>
      <div class="seg" data-id="${r.id}"><button data-v="small">瑕疵太小，看不到</button><button data-v="many">太多，看不完</button></div><span></span>`).join("")}</div>
      <div class="fb" id="mfb"></div><button class="btn" id="submit" disabled style="margin-top:10px">送出結案報告</button></div>`;
    $("match").onclick = e => {
      const b = e.target.closest(".seg button"); if (!b) return;
      const seg = b.parentElement; pick[seg.dataset.id] = b.dataset.v;
      seg.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
      $("submit").disabled = Object.keys(pick).length < ROWS.length;
    };
    $("submit").onclick = () => {
      save({ "ans/match": ROWS.map(r => pick[r.id]).join(",") });
      if (ROWS.some(r => pick[r.id] !== r.ok)) { $("mfb").textContent = "再想想：放大拍照是為了看到什麼？交給電腦是為了解決什麼？"; return; }
      goStage(5);
    };
    refresh();
  };
  refresh();
}

// ════════════ 結案 ════════════
function done() {
  $("hintBtn").hidden = true;
  $("app").innerHTML = `<section class="stage" style="grid-template-columns:1fr">
    <div class="story" style="max-width:720px;margin:0 auto;justify-content:center">
      <h2 style="font-size:40px">🎉 結案！</h2>
      <div class="next"><p><b>你們的檢測方法：</b></p>
        <p>每蓋完一層電路 → 用高倍鏡頭的相機放大拍下來 → 讓電腦把照片跟標準電路圖逐點比對 → 標出不一樣的地方，把壞晶片挑掉，再蓋下一層</p></div>
      <p>結案報告已經送給老師了。<b>真正的晶片工廠，是不是也這樣做呢？</b>抬頭看投影幕，等老師揭曉真相！</p>
    </div></section>`;
}

// ════════════ 加入、等待、同步 ════════════
async function boot() {
  if (!CODE) { ov(`<h2>找不到案件代碼</h2><p>請重新掃描投影幕上的 QR code。</p>`); return; }
  ov(`<h2>連線中…</h2><p>案件 ${CODE}</p>`);
  uid = await db.ready();
  let first = true;
  db.watch(`cases/${CODE}/meta`, m => {
    if (!m) { ov(`<h2>找不到案件 ${CODE}</h2><p>可能老師已經關掉這個案件了。請重新掃描投影幕上的 QR code。</p>`); return; }
    const prev = meta && meta.state, prevRound = meta && (meta.round || 0); meta = m;
    if (first) { first = false; return enter(); }
    if (me && (m.round || 0) !== prevRound) return restartRound();  // 老師按了「同一批小組重來」
    if (me && m.state !== prev) applyState();
  });
}
async function enter() {
  me = await db.get(gpath());
  if (me && me.name) { $("groupName").innerHTML = `調查小組 <b>${esc(me.name)}</b>`; $("groupName").hidden = false; return applyState(); }
  showJoin();
}
function showJoin(note = "") {
  ov(`<h2>🕵️ 晶片懸案</h2><p>案件 <b>${CODE}</b></p>${note ? `<p style="color:#ffd166">${note}</p>` : ""}
    <p>輸入你們小組的名字（最多 10 個字）</p><input id="nm" maxlength="10" autocomplete="off" placeholder="例如：第 3 組" enterkeyhint="go">
    <p class="err" id="err"></p><button class="btn" id="join">加入調查</button>`);
  const go = async () => {
    const name = $("nm").value.replace(/\s+/g, " ").trim().slice(0, 10);
    if (!name) { $("err").textContent = "請先輸入小組名字"; return; }
    $("join").disabled = true;
    try {
      me = { name, stage: 0, t: Math.round(db.serverNow()) };
      await db.set(gpath(), me);
      $("groupName").innerHTML = `調查小組 <b>${esc(name)}</b>`; $("groupName").hidden = false;
      applyState();
    } catch (e) { console.warn(e); $("err").textContent = "加入失敗，請再按一次"; $("join").disabled = false; }
  };
  $("join").onclick = go;
  $("nm").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
}
let started = false;
async function restartRound() {
  started = false; stage = 0; hintLevel = 0;
  $("app").innerHTML = "";
  me = await db.get(gpath());
  if (!me || !me.name) { me = null; $("groupName").hidden = true; return showJoin("老師重新開了一局，請再輸入一次小組名字"); }
  applyState();
}
function applyState() {
  renderTop();
  if (meta.state === "lobby") {
    ov(`<h2>小組 ${esc(me.name)} 已加入</h2><p>等老師按「開始調查」……</p><div class="dots"><i></i><i></i><i></i></div>`);
  } else if (meta.state === "open") {
    hideOv();
    if (!started) { started = true; goStage(me.stage || 0, false); }
  } else {
    ov(`<h2>調查時間結束</h2><p>抬頭看投影幕，老師要揭曉真相了！</p>`);
  }
}

boot().catch(e => { console.error(e); ov(`<h2>連不上</h2><p>請確認平板有連上網路，再重新整理一次。</p>`); });
</script>
