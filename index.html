<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>晶片檢測站</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
  :root{
    --ground:#140e22; --panel:#211733; --panel2:#2b1f41; --line:rgba(255,255,255,.12);
    --text:#f6f1ea; --muted:rgba(246,241,234,.62);
    --accent:#ffb35c; --hot:#ff8a5c; --green:#6fdca0; --red:#ff5c6c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overscroll-behavior:none}
  body{
    background:radial-gradient(120% 90% at 50% -10%,#3a2752 0%,var(--ground) 62%);
    color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);height:100dvh;overflow:hidden;
    touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button{font:inherit;cursor:pointer}
  [hidden]{display:none!important}

  /* ── 頂部 ── */
  .top{display:flex;align-items:center;gap:12px;padding:10px 16px}
  .brand{font-weight:900;font-size:clamp(17px,2.2vw,24px);letter-spacing:.05em;margin-right:auto;white-space:nowrap}
  .brand span{font-weight:400;color:var(--muted);font-size:.68em;margin-left:8px}
  .pill{display:flex;align-items:baseline;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 16px;color:var(--muted);font-size:clamp(13px,1.5vw,16px);white-space:nowrap}
  .pill b{color:var(--text);font-size:1.45em;font-weight:900;font-variant-numeric:tabular-nums}
  .pill.clock b{min-width:2.2em;text-align:center;color:var(--accent)}
  .pill.clock.low{border-color:var(--red);animation:pulse 1s infinite}
  .pill.clock.low b{color:var(--red)}
  @keyframes pulse{50%{background:#4a1f2c}}

  /* ── 晶片圖 ── */
  .mid{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 8px;min-height:0}
  .stage{position:relative;flex:none;border-radius:10px;overflow:hidden;background:#000;box-shadow:0 10px 40px rgba(0,0,0,.45);touch-action:none}
  .stage img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
  .stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .stage.locked{filter:saturate(.6) brightness(.7)}
  .nav{flex:none;width:52px;height:96px;border:0;border-radius:16px;background:var(--panel);color:var(--text);font-size:30px;font-weight:900}
  .nav:disabled{opacity:.25}
  .label{position:absolute;left:14px;top:10px;padding:4px 14px;border-radius:999px;background:rgba(20,14,34,.82);font-weight:900;font-size:clamp(15px,1.8vw,20px);pointer-events:none}
  .pop{position:absolute;transform:translate(-50%,-120%);font-weight:900;font-size:26px;pointer-events:none;animation:floatup .9s forwards;text-shadow:0 2px 8px rgba(0,0,0,.8)}
  .pop.plus{color:var(--green)}
  .pop.minus{color:var(--red)}
  .pop.same{color:var(--text);font-size:18px}
  @keyframes floatup{0%{opacity:0;transform:translate(-50%,-60%) scale(.6)}20%{opacity:1;transform:translate(-50%,-120%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-220%)}}
  .ring{fill:none;stroke:var(--green);stroke-width:3.5;animation:ringin .35s cubic-bezier(.3,1.6,.5,1)}
  .ans{fill:none;stroke:var(--red);stroke-width:4}
  .miss{stroke:var(--red);stroke-width:3;stroke-linecap:round;animation:missout 1s forwards}
  @keyframes ringin{0%{opacity:0}100%{opacity:1}}
  @keyframes missout{0%{opacity:1}70%{opacity:1}100%{opacity:0}}

  /* ── 6 張縮圖：平板橫放時排在右邊兩欄，直放時排在底下一列 ── */
  .tabs{display:flex;justify-content:center;gap:10px;padding:10px 12px 12px}
  .tab{position:relative;flex:0 1 72px;border:3px solid transparent;border-radius:12px;padding:0;background:var(--panel);overflow:hidden;color:var(--text)}
  .tab img{display:block;width:100%;aspect-ratio:486/760;object-fit:cover;opacity:.75;pointer-events:none}
  @media (min-aspect-ratio:1/1){
    body{grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr) auto}
    .top{grid-column:1 / -1}
    .tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:center;gap:10px;padding:0 16px 12px 4px;width:clamp(150px,19vw,210px)}
  }
  .tab .n{position:absolute;left:6px;top:4px;font-weight:900;font-size:18px;text-shadow:0 1px 4px #000}
  .tab .ok{position:absolute;right:5px;bottom:5px;background:var(--green);color:#10241a;border-radius:999px;padding:0 8px;font-weight:900;font-size:14px}
  .tab.on{border-color:var(--accent)}
  .tab.on img{opacity:1}

  /* ── 覆蓋卡片 ── */
  #overlay{position:fixed;inset:0;z-index:50;background:rgba(14,10,24,.84);display:grid;place-items:center;padding:16px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  .card{width:min(500px,100%);max-height:100%;overflow:auto;background:#241a33;border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:28px 26px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.5)}
  .card h2{margin:0 0 10px;font-size:clamp(22px,3vw,30px)}
  .card p{margin:8px 0;color:rgba(246,241,234,.78);font-size:16px;line-height:1.65}
  .card .room b{color:var(--accent);font-size:1.4em;letter-spacing:.12em}
  .card .note{color:#ffd166}
  .card .rule{margin-top:14px;padding:14px;border-radius:14px;background:rgba(255,255,255,.06);font-size:15.5px;text-align:left}
  .card .rule b{color:var(--accent)}
  .card .err{color:#ff8f80;min-height:1.4em;margin:6px 0 0}
  .card .name{font-size:28px;font-weight:900;color:#fff}
  .card .big{font-size:64px;font-weight:900;color:var(--accent);margin:6px 0;font-variant-numeric:tabular-nums}
  .card .big small{font-size:22px;color:var(--muted)}
  .card label{display:block;margin:18px 0 8px;font-size:15px;color:var(--muted)}
  .card input{width:100%;font:inherit;font-size:24px;text-align:center;padding:12px;border-radius:14px;border:2px solid rgba(255,255,255,.2);background:#160f22;color:#fff;-webkit-user-select:text;user-select:text}
  .card input:focus{outline:none;border-color:var(--accent)}
  .card button{margin-top:14px;width:100%;min-height:52px;border:0;border-radius:999px;background:var(--accent);color:#1c1526;font-size:20px;font-weight:900}
  .card button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);font-size:16px;min-height:44px}
  .card button:disabled{opacity:.5}
  .dots{display:flex;gap:8px;justify-content:center;margin-top:16px}
  .dots i{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:dot 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
  @keyframes dot{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
  .count{font-size:120px;font-weight:900;color:var(--accent);line-height:1;margin:10px 0;font-variant-numeric:tabular-nums}

  @media (max-height:600px){
    .tabs{padding:6px 10px 8px}.tab{flex-basis:96px}.top{padding:6px 12px}
  }
  @media (max-width:700px){
    .nav{width:36px;height:72px;font-size:22px}.brand span{display:none}
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand">晶片檢測站<span>把做壞的晶片挑出來</span></div>
  <div class="pill clock" id="clockPill">剩下 <b id="clock">50</b> 秒</div>
  <div class="pill">分數 <b id="score">0</b></div>
</header>

<div class="mid">
  <button class="nav" id="prev" aria-label="上一張">‹</button>
  <div class="stage locked" id="stage">
    <img id="chipImg" alt="" draggable="false">
    <svg id="marks" preserveAspectRatio="none"></svg>
    <div class="label" id="label">第 1 張</div>
  </div>
  <button class="nav" id="next" aria-label="下一張">›</button>
</div>

<nav class="tabs" id="tabs"></nav>

<div id="overlay"><div class="card" id="card"><h2>載入中…</h2></div></div>

<script type="module">
import { CHIPS, PTS_RIGHT, PTS_WRONG, DEFAULT_SECONDS, hitTest, defectCircle } from "./data.js";
import * as net from "./net.js";

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const ROOM = /^\d{4}$/.test(params.get("room") || "") ? params.get("room") : null;
const TEACHER = params.has("teacher");
const TAP_GAP = 250; // 兩次點擊至少隔多久（毫秒），避免連點亂槍打鳥

// ── 遊戲狀態 ──
let G;          // 這一局的成績
let cur = 0;    // 現在看第幾張
let running = false, endsAt = 0, seenSince = 0, lastTap = 0;
let showAnswers = false;

function freshGame() {
  return { score: 0, found: 0, wrong: 0, chips: CHIPS.map(() => ({ seen: 0, hits: [], taps: [] })) };
}
G = freshGame();

// ── 畫面 ──
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }

$("tabs").innerHTML = CHIPS.map((c, i) =>
  `<button class="tab" data-i="${i}" aria-label="第 ${i + 1} 張"><img src="img/chip${i + 1}-thumb.jpg" alt=""><span class="n">${i + 1}</span><span class="ok" hidden></span></button>`
).join("");
document.querySelectorAll(".tab").forEach(b => b.onclick = () => go(+b.dataset.i));
$("prev").onclick = () => go(cur - 1);
$("next").onclick = () => go(cur + 1);
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowLeft") go(cur - 1);
  if (e.key === "ArrowRight") go(cur + 1);
});

// iPad Safari 會忽略 user-scalable=no，另外擋雙指縮放
["gesturestart", "gesturechange"].forEach(t => document.addEventListener(t, e => e.preventDefault()));
document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

function fitStage() {
  const mid = document.querySelector(".mid").getBoundingClientRect();
  const navW = $("prev").offsetWidth * 2 + 32;
  const ar = CHIPS[cur].w / CHIPS[cur].h;
  let w = Math.min(mid.width - navW, (mid.height - 8) * ar);
  $("stage").style.width = w + "px";
  $("stage").style.height = w / ar + "px";
}
addEventListener("resize", fitStage);

function go(i) {
  if (i < 0 || i >= CHIPS.length || i === cur) return;
  noteSeen();
  cur = i;
  render();
}

function render() {
  $("chipImg").src = `img/chip${cur + 1}.png`;
  $("label").textContent = `第 ${cur + 1} 張`;
  $("prev").disabled = cur === 0;
  $("next").disabled = cur === CHIPS.length - 1;
  const svg = $("marks");
  svg.setAttribute("viewBox", `0 0 ${CHIPS[cur].w} ${CHIPS[cur].h}`);
  svg.innerHTML = "";
  const c = G.chips[cur];
  CHIPS[cur].defects.forEach((segs, d) => {
    const { cx, cy, rx, ry, rot } = defectCircle(segs);
    const transform = `rotate(${rot} ${cx} ${cy})`;
    if (c.hits.includes(d)) svg.appendChild(el("ellipse", { class: "ring", cx, cy, rx, ry, transform }));
    else if (showAnswers) svg.appendChild(el("ellipse", { class: "ans", cx, cy, rx, ry, transform }));
  });
  document.querySelectorAll(".tab").forEach((b, i) => {
    b.classList.toggle("on", i === cur);
    const ok = b.querySelector(".ok"), n = G.chips[i].hits.length;
    ok.hidden = !n; ok.textContent = "✓ " + n;
  });
  $("score").textContent = G.score;
  $("stage").classList.toggle("locked", !running && !showAnswers);
  fitStage();
}

function pop(x, y, text, kind) {
  const p = document.createElement("div");
  p.className = "pop " + kind;
  p.textContent = text;
  p.style.left = (x / CHIPS[cur].w * 100) + "%";
  p.style.top = (y / CHIPS[cur].h * 100) + "%";
  $("stage").appendChild(p);
  setTimeout(() => p.remove(), 900);
}

// ── 點擊 ──
$("stage").addEventListener("pointerdown", e => {
  if (!running || !e.isPrimary) return;
  const t = Date.now();
  if (t - lastTap < TAP_GAP) return;
  lastTap = t;
  const r = $("stage").getBoundingClientRect();
  const x = Math.round((e.clientX - r.left) / r.width * CHIPS[cur].w);
  const y = Math.round((e.clientY - r.top) / r.height * CHIPS[cur].h);
  const c = G.chips[cur];
  const d = hitTest(cur, x, y);
  if (c.taps.length < 120) c.taps.push([x, y, d]); // 每張最多記 120 下，免得資料太大
  if (d >= 0 && !c.hits.includes(d)) {
    c.hits.push(d);
    G.found++;
    G.score += PTS_RIGHT;
    pop(x, y, "+" + PTS_RIGHT, "plus");
    render();
  } else if (d >= 0) {
    pop(x, y, "這個找過了", "same");
  } else {
    G.wrong++;
    G.score = Math.max(0, G.score - PTS_WRONG);
    pop(x, y, "−" + PTS_WRONG, "minus");
    const k = 9, g = el("g", {});
    g.appendChild(el("line", { class: "miss", x1: x - k, y1: y - k, x2: x + k, y2: y + k }));
    g.appendChild(el("line", { class: "miss", x1: x - k, y1: y + k, x2: x + k, y2: y - k }));
    $("marks").appendChild(g);
    setTimeout(() => g.remove(), 1000);
    $("score").textContent = G.score;
  }
  schedulePush();
});

// ── 計時 ──
function noteSeen() {
  if (running && seenSince) {
    const t = Date.now();
    G.chips[cur].seen += t - seenSince;
    seenSince = t;
  }
}

let clockTimer = 0;
function startRound(ends) {
  endsAt = ends;
  running = true;
  seenSince = Date.now();
  hideCard();
  render();
  clearInterval(clockTimer);
  clockTimer = setInterval(tickClock, 200);
  tickClock();
}
function tickClock() {
  const left = Math.max(0, Math.ceil((endsAt - net.serverNow()) / 1000));
  $("clock").textContent = left;
  $("clockPill").classList.toggle("low", running && left <= 10);
  if (running && left <= 0) finishRound();
}
function finishRound() {
  if (!running) return;
  noteSeen();
  running = false;
  clearInterval(clockTimer);
  $("clockPill").classList.remove("low");
  $("clock").textContent = 0;
  render();
  pushNow();
  showEnd();
}

// ── 卡片 ──
function card(html) { $("card").innerHTML = html; $("overlay").hidden = false; }
function hideCard() { $("overlay").hidden = true; }
function esc(t) { return String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

const RULE = secs => `<div class="rule">
  工廠剛做好一批晶片，這是其中 <b>6 張</b>的電路圖。有幾張做壞了：可能有<b>斷線</b>、<b>兩條線黏在一起</b>、<b>卡到灰塵</b>或<b>刮傷</b>。<br>
  你只有 <b>${secs} 秒</b>，看到瑕疵就點它！下面的 1–6 可以換張。<br>
  點到瑕疵 <b>+${PTS_RIGHT}</b>，點錯 <b>−${PTS_WRONG}</b>，想清楚再點。
</div>`;

function showEnd() {
  const tail = ROOM
    ? `<p class="note">抬頭看投影幕，老師要公布答案了</p>`
    : `<button type="button" id="again">再玩一次</button>${TEACHER ? `<button type="button" class="ghost" id="reveal">顯示答案</button>` : ""}`;
  card(`<h2>時間到！</h2>
    <p class="big">${G.score}<small> 分</small></p>
    <p>你找到 <b>${G.found}</b> 個瑕疵</p>${tail}`);
  if (!ROOM) {
    $("again").onclick = () => { G = freshGame(); cur = 0; showAnswers = false; render(); soloIntro(); };
    if (TEACHER) $("reveal").onclick = () => { showAnswers = true; hideCard(); render(); };
  }
}

// ── 單人模式 ──
function soloIntro() {
  card(`<h2>晶片檢測站</h2>${RULE(DEFAULT_SECONDS)}<button type="button" id="go">開始</button>`);
  $("go").onclick = () => {
    let n = 3;
    card(`<p>準備好了嗎？</p><div class="count" id="cd">3</div>`);
    const t = setInterval(() => {
      n--;
      if (n > 0) { $("cd").textContent = n; return; }
      clearInterval(t);
      G = freshGame(); cur = 0;
      startRound(net.serverNow() + DEFAULT_SECONDS * 1000);
    }, 800);
  };
}

// ── 班級模式 ──
let me = null;          // { uid, token }
let pushTimer = 0, pushing = false, pushAgain = false;
const meKey = "ci-me-" + ROOM;

function schedulePush() {
  if (!ROOM || !me || pushTimer) return;
  pushTimer = setTimeout(() => { pushTimer = 0; pushNow(); }, 400);
}
async function pushNow() {
  if (!ROOM || !me) return;
  if (pushing) { pushAgain = true; return; }
  pushing = true;
  noteSeen();
  try { await net.pushMe(ROOM, me.uid, me.token, G); } catch (e) { console.warn(e); }
  pushing = false;
  if (pushAgain) { pushAgain = false; pushNow(); }
}

function showJoin(note = "") {
  let saved = "";
  try { saved = localStorage.getItem("ci-name") || ""; } catch (e) {}
  card(`<h2>加入晶片檢測站</h2>
    <p class="room">房間 <b>${ROOM}</b></p>
    ${note ? `<p class="note">${note}</p>` : ""}
    <label for="nm">你的名字（最多 8 個字）</label>
    <input id="nm" maxlength="8" autocomplete="off" enterkeyhint="go">
    <p class="err" id="err"></p>
    <button type="button" id="join">加入</button>`);
  const input = $("nm");
  input.value = saved;
  const go = async () => {
    const name = input.value.replace(/\s+/g, " ").trim().slice(0, 8);
    if (!name) { $("err").textContent = "請先輸入名字"; return; }
    $("join").disabled = true;
    try { localStorage.setItem("ci-name", name); } catch (e) {}
    try {
      const r = await net.join(ROOM, name);
      me = { uid: r.uid, token: r.token, name, created: r.meta.created };
      try { localStorage.setItem(meKey, JSON.stringify(me)); } catch (e) {}
      applyMeta(r.meta);
    } catch (e) {
      $("err").textContent = e.code === "no-room" ? "找不到這個房間，請重新掃 QR code" : e.code === "full" ? "房間人數滿了" : "加入失敗，請再按一次";
      $("join").disabled = false;
    }
  };
  $("join").onclick = go;
  input.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
}

let lastState = null;
function applyMeta(meta) {
  if (!me) return;
  // 老師開了新的一局（同一房間重玩）：清掉這台平板上的成績
  if (meta.created !== me.created) {
    me.created = meta.created;
    try { localStorage.setItem(meKey, JSON.stringify(me)); } catch (e) {}
    running = false; clearInterval(clockTimer);
    G = freshGame(); cur = 0; render();
    lastState = null;
  }
  if (meta.state === lastState) return;
  lastState = meta.state;
  if (meta.state === "playing" && net.serverNow() < meta.endsAt) {
    startRound(meta.endsAt);
  } else if (meta.state === "playing" || meta.state === "ended") {
    if (running) finishRound(); else { render(); showEnd(); }
  } else {
    running = false; clearInterval(clockTimer);
    $("clock").textContent = meta.seconds;
    render();
    card(`<h2>你已經加入了！</h2>
      <p class="name">${esc(me.name)}</p>
      <p>等老師按「開始」</p>
      ${RULE(meta.seconds)}
      <div class="dots"><i></i><i></i><i></i></div>`);
  }
}

async function roomMode() {
  try { me = JSON.parse(localStorage.getItem(meKey) || "null"); } catch (e) {}
  card(`<h2>連線中…</h2><p>房間 ${ROOM}</p>`);
  let first = true;
  net.watchMeta(ROOM, () => me, (r, askedUid) => {
    if (first) {
      first = false;
      if (me && r.me) {
        // 重新整理或平板睡著後接回去：成績從伺服器拿回來
        me.name = r.me.name;
        if (r.meta.created === me.created) G = { score: r.me.score, found: r.me.found, wrong: r.me.wrong, chips: r.me.chips };
        applyMeta(r.meta);
      } else { me = null; showJoin(); }
      return;
    }
    if (me && askedUid === me.uid && !r.me) {   // 被老師移出房間
      me = null; running = false; clearInterval(clockTimer);
      try { localStorage.removeItem(meKey); } catch (e) {}
      showJoin("你被移出房間了，請重新輸入名字");
      return;
    }
    if (me) applyMeta(r.meta);
  }, () => {
    running = false;
    card(`<h2>找不到房間 ${ROOM}</h2><p>可能老師已經關掉這一局了。請重新掃描投影幕上的 QR code。</p>`);
  });
  // 遊戲中每 2 秒回報一次（讓老師端的「每張看了幾秒」跟得上）
  setInterval(() => { if (running) pushNow(); }, 2000);
}

render();
if (ROOM) roomMode(); else soloIntro();
</script>
</body>
</html>
