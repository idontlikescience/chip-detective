<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>晶片懸案．老師控制台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕵️</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  /* 投影專用：固定深色 */
  :root{
    --ground:#140e22; --panel:#211733; --panel2:#2b1f41; --line:rgba(255,255,255,.12);
    --text:#f6f1ea; --muted:rgba(246,241,234,.62);
    --accent:#ffb35c; --hot:#ff8a5c; --green:#6fdca0; --red:#ff5c6c;
    --paper:#f4ead6; --paperInk:#2a2118;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(120% 90% at 50% -10%,#3a2752 0%,var(--ground) 62%);
    color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    display:flex;flex-direction:column;overflow:hidden;padding:0 clamp(16px,2.4vw,40px);
  }
  button{font:inherit;cursor:pointer;color:inherit}
  [hidden]{display:none!important}
  .top{display:flex;align-items:center;gap:clamp(10px,1.6vw,24px);padding-block:14px;flex-wrap:wrap}
  .brand{font-weight:900;font-size:clamp(18px,1.9vw,26px);letter-spacing:.05em;margin-right:auto}
  .brand span{font-weight:400;color:var(--muted);font-size:.7em;margin-left:10px}
  .pill{display:flex;align-items:baseline;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 18px;font-size:clamp(14px,1.3vw,18px);color:var(--muted)}
  .pill b{color:var(--text);font-size:1.5em;font-weight:900;font-variant-numeric:tabular-nums}
  .pill.code b{color:var(--accent);letter-spacing:.06em}
  main{flex:1;min-height:0;display:flex;flex-direction:column;padding-bottom:18px}
  .view{flex:1;min-height:0}
  .bigbtn{border:0;border-radius:999px;background:var(--accent);color:#1c1526;font-weight:900;font-size:clamp(18px,1.7vw,24px);padding:14px 34px;min-height:54px}
  .bigbtn:disabled{opacity:.4}
  .ghost{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:8px 18px;font-size:15px;min-height:42px}
  .ghost:hover{color:var(--accent);border-color:var(--accent)}
  .empty{color:var(--muted);font-size:18px}

  /* 等待區 */
  #vLobby{display:flex;gap:clamp(20px,3vw,48px);align-items:center;justify-content:center;--qr:min(calc(100vh - 120px),44vw)}
  .joincard{flex:none;width:var(--qr);height:var(--qr);background:#fff;border-radius:22px;padding:10px}
  .qr,.qr svg{width:100%;height:100%;display:block}
  .side{flex:0 1 640px;min-width:0;height:var(--qr);display:flex;flex-direction:column;gap:12px}
  .how{margin:0;font-size:clamp(20px,2vw,30px);font-weight:900}
  .bigcode{margin:0;color:var(--muted)}
  .bigcode b{display:block;color:var(--accent);font-size:clamp(64px,8vw,140px);font-weight:900;letter-spacing:.12em;line-height:1}
  .url{margin:0;color:var(--muted);font-size:14px;word-break:break-all}
  .url b{color:var(--text)}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
  .box h3{margin:0 0 8px;font-size:18px}
  .box p{margin:4px 0;color:var(--muted);font-size:15px;line-height:1.6}
  .box p b{color:var(--text)}
  .evrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .evrow input{width:6em;font:inherit;font-size:20px;text-align:center;padding:6px;border-radius:10px;border:1px solid var(--line);background:#160f22;color:#fff;letter-spacing:.1em}
  .evok{color:var(--green)!important}
  .everr{color:#ff8f80!important}
  .names{display:flex;flex-wrap:wrap;gap:8px;min-height:0;overflow:auto}
  .nm{border:0;background:var(--panel2);border-radius:12px;padding:6px 16px;font-size:clamp(18px,1.7vw,24px);font-weight:900}
  .nm:hover{text-decoration:line-through;background:#4a2f3a}
  .foot{display:flex;align-items:center;gap:12px;margin-top:auto}
  .foot .tip{color:var(--muted);font-size:13px;margin-right:auto}

  /* 進行中 */
  #vRun{display:flex;flex-direction:column;gap:14px;min-height:0}
  .summary{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .summary .s{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 16px;font-size:16px;color:var(--muted)}
  .summary .s b{color:var(--text);font-size:1.6em;margin-left:6px;font-variant-numeric:tabular-nums}
  .summary .ghost{margin-left:auto}
  .summary .bigbtn{font-size:18px;padding:10px 24px;min-height:46px;background:var(--hot)}
  .board{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px}
  .grow{display:grid;grid-template-columns:minmax(120px,1.2fr) minmax(0,3fr) 90px 80px;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 16px;text-align:left;width:100%;border-radius:14px}
  .grow .gn{font-weight:900;font-size:clamp(18px,1.6vw,24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grow .pp{display:flex;gap:6px}
  .grow .pp span{flex:1;text-align:center;padding:4px 0;border-radius:999px;background:var(--panel2);font-size:14px;color:var(--muted)}
  .grow .pp span.d{background:#1d3a2c;color:var(--green)}
  .grow .pp span.n{background:var(--accent);color:#1c1526;font-weight:900}
  .grow .tm,.grow .hn{text-align:right;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
  .grow .tm b,.grow .hn b{color:var(--text);font-size:1.3em}
  .detail{background:var(--panel2);border-radius:12px;padding:10px 16px;margin-top:-4px;font-size:15px;line-height:1.7;color:var(--muted)}
  .detail b{color:var(--text)}

  /* 結案 */
  #vReport{display:flex;flex-direction:column;gap:14px;min-height:0}
  .truth{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#3a2a1c,#2b1f41);border:1px solid var(--accent);border-radius:18px;padding:14px 20px}
  .truth h2{margin:0;font-size:clamp(24px,2.4vw,36px)}
  .truth p{margin:4px 0 0;color:var(--muted);font-size:16px}
  .truth .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .reports{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;align-content:start}
  .rep{background:var(--paper);color:var(--paperInk);border-radius:14px;padding:12px 16px;font-size:15px;line-height:1.6}
  .rep h3{margin:0 0 4px;font-size:22px}
  .rep .meta{color:#6b5b45;font-size:13px;margin-bottom:6px}
  .rep dl{margin:0;display:grid;grid-template-columns:5.5em 1fr;gap:2px 8px}
  .rep dt{font-weight:900;color:#8a5a12}
  .rep dd{margin:0}
  .rep .tries{color:#b03a1e;font-size:13px}
  .rep .txt{font-style:italic}
</style>
</head>
<body>
<header class="top">
  <div class="brand">🕵️ 晶片懸案<span>老師控制台</span></div>
  <div class="pill code" id="pillCode" hidden>案件 <b id="code">----</b></div>
  <div class="pill" id="pillN" hidden>小組 <b id="nGroups">0</b></div>
  <div class="pill" id="pillClock" hidden>已進行 <b id="clock">0:00</b></div>
</header>
<main>
  <div class="view" id="vBoot"><p class="empty" style="text-align:center;margin-top:20vh">開案件中…</p></div>

  <section class="view" id="vLobby" hidden>
    <div class="joincard"><div class="qr" id="qr"></div></div>
    <div class="side">
      <p class="how">每組一台平板，掃 QR code 加入調查</p>
      <p class="bigcode">案件代碼<b id="bigCode">----</b></p>
      <p class="url" id="joinUrl"></p>
      <div class="box">
        <h3>證物數據：第一個遊戲（晶片檢測站）的房間代碼</h3>
        <div class="evrow"><input id="srcCode" maxlength="4" inputmode="numeric" placeholder="代碼"><button class="ghost" id="loadEv">讀取全班數據</button><button class="ghost" id="sampleEv">沒有，用範例數據</button></div>
        <p id="evMsg">開場的證物會用全班在第一個遊戲的真實數據。</p>
      </div>
      <div class="box" style="flex:1;min-height:0;display:flex;flex-direction:column">
        <h3>已加入的小組（點名字可以移出）</h3>
        <div class="names" id="names"><p class="empty">還沒有小組加入</p></div>
      </div>
      <div class="foot"><span class="tip">各組自由進度，約 20 分鐘</span><button class="ghost" data-act="new">開新案件</button><button class="bigbtn" id="btnStart" disabled>開始調查</button></div>
    </div>
  </section>

  <section class="view" id="vRun" hidden>
    <div class="summary" id="summary"></div>
    <div class="board" id="board"></div>
  </section>

  <section class="view" id="vReport" hidden>
    <div class="truth"><div><h2>真相揭曉：真正的工廠是怎麼做的？</h2>
      <p>播放 AOI 機台影片（簡報 p.29），請各組對照自己的結案報告：哪些地方一樣？</p></div>
      <div class="acts"><button class="ghost" id="btnBack">回到進度</button><button class="ghost" data-act="restart">同一批小組重來</button><button class="ghost" data-act="new">開新案件</button></div></div>
    <div class="reports" id="reports"></div>
  </section>
</main>

<script type="module">
import * as db from "./db.js";
import { STAGES, SAMPLE_EVIDENCE, evidenceFromRoom } from "./data.js";

const $ = id => document.getElementById(id);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const STALE = 12 * 60 * 60 * 1000;
let uid, code, meta = null, groups = {}, view = "boot", stopWatch = null, openRow = null;

function show(v) {
  view = v;
  ["Boot", "Lobby", "Run", "Report"].forEach(n => $("v" + n).hidden = n.toLowerCase() !== v);
}

// ── 開案件 ──
async function openCase(forceNew = false) {
  show("boot");
  uid = await db.ready();
  let saved = null;
  if (!forceNew) { try { saved = JSON.parse(localStorage.getItem("cd-teacher") || "null"); } catch (e) {} }
  if (saved) {
    const m = await db.get(`cases/${saved.code}/meta`).catch(() => null);
    if (m && m.owner === uid) code = saved.code; else saved = null;
  }
  if (!saved) {
    for (let k = 0; k < 40; k++) {
      const c = String(1000 + Math.floor(Math.random() * 9000));
      const old = await db.get(`cases/${c}/meta`).catch(() => null);
      if (old && db.serverNow() - (old.created || 0) < STALE) continue;
      await db.set(`cases/${c}`, { meta: { owner: uid, state: "lobby", created: Math.round(db.serverNow()), startedAt: 0 } });
      code = c; break;
    }
    try { localStorage.setItem("cd-teacher", JSON.stringify({ code })); } catch (e) {}
  }
  $("code").textContent = $("bigCode").textContent = code;
  $("pillCode").hidden = $("pillN").hidden = false;

  let base = location.origin + location.pathname.replace(/[^/]*$/, "");
  if (!db.usingFirebase) { try { const i = await (await fetch("/api/info")).json(); if (i.lan) base = i.lan + location.pathname.replace(/[^/]*$/, ""); } catch (e) {} }
  const url = base + "index.html?case=" + code + (db.usingFirebase ? "" : "&local");
  $("joinUrl").innerHTML = `或在瀏覽器輸入 <b>${esc(url)}</b>`;
  const q = qrcode(0, "M"); q.addData(url); q.make();
  $("qr").innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });

  if (stopWatch) stopWatch();
  let last = null;
  stopWatch = db.watch(`cases/${code}`, v => {
    if (!v || !v.meta) { openCase(true); return; }
    meta = v.meta; groups = v.groups || {};
    $("nGroups").textContent = Object.keys(groups).length;
    if (meta.state !== last) {
      last = meta.state;
      show({ lobby: "lobby", open: "run", closed: "report" }[meta.state]);
      $("pillClock").hidden = meta.state === "lobby";
    }
    render();
  });
}

function render() {
  if (view === "lobby") renderLobby();
  if (view === "run") renderRun();
  if (view === "report") renderReport();
}

// ── 等待區 ──
function renderLobby() {
  const list = Object.entries(groups);
  $("names").innerHTML = list.length ? list.map(([u, g]) => `<button class="nm" data-u="${u}">${esc(g.name)}</button>`).join("") : `<p class="empty">還沒有小組加入</p>`;
  const e = meta.evidence;
  if (e) $("evMsg").innerHTML = e.source === "sample"
    ? `<span class="evok">✔ 使用範例數據</span>：${e.n} 人、第 6 張找到 ${e.chip6Found} 人、平均每張 ${e.avgSec} 秒`
    : `<span class="evok">✔ 已讀取房間 ${esc(e.source)}</span>：${e.n} 人、第 6 張找到 ${e.chip6Found} 人、${e.notFinished} 人沒看完、平均每張 ${e.avgSec} 秒`;
  $("btnStart").disabled = !e;
  $("btnStart").title = e ? "" : "請先設定證物數據";
}
$("names").onclick = e => {
  const b = e.target.closest(".nm"); if (!b) return;
  if (confirm(`把「${b.textContent}」移出案件？`)) db.remove(`cases/${code}/groups/${b.dataset.u}`);
};
$("loadEv").onclick = async () => {
  const c = $("srcCode").value.trim();
  if (!/^\d{4}$/.test(c)) { $("evMsg").innerHTML = `<span class="everr">請輸入 4 位數的房間代碼</span>`; return; }
  $("evMsg").textContent = "讀取中…";
  const room = await db.get(`rooms/${c}`).catch(() => null);
  const ev = room && evidenceFromRoom(c, room);
  if (!ev) { $("evMsg").innerHTML = `<span class="everr">找不到房間 ${c} 的成績。房間可能已經被清掉，或還沒有人玩過；也可以改用範例數據。</span>`; return; }
  await db.update(`cases/${code}/meta`, { evidence: ev });
};
$("sampleEv").onclick = () => db.update(`cases/${code}/meta`, { evidence: SAMPLE_EVIDENCE });
$("btnStart").onclick = () => db.update(`cases/${code}/meta`, { state: "open", startedAt: Math.round(db.serverNow()) });

// ── 進行中 ──
const fmt = ms => { const s = Math.max(0, Math.round(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const totalHints = g => Object.values(g.hints || {}).reduce((a, b) => a + b, 0);
const usedTime = g => g.stage >= 5 ? Object.values(g.times || {}).reduce((a, b) => a + b, 0) : db.serverNow() - meta.startedAt;
function renderRun() {
  const list = Object.entries(groups).sort((a, b) => (b[1].stage || 0) - (a[1].stage || 0));
  const count = i => list.filter(([, g]) => (g.stage || 0) === i).length;
  $("summary").innerHTML = STAGES.map((s, i) => `<div class="s">${s}<b>${count(i)}</b></div>`).join("") +
    `<div class="s">已結案<b>${count(5)}</b></div><button class="ghost" data-act="restart">同一批小組重來</button><button class="bigbtn" id="btnEnd">結束調查，看結案報告</button>`;
  $("btnEnd").onclick = () => { if (confirm("結束調查？還沒結案的小組會停在目前的關卡。")) db.update(`cases/${code}/meta`, { state: "closed", closedAt: Math.round(db.serverNow()) }); };
  $("board").innerHTML = list.map(([u, g]) => {
    const st = g.stage || 0;
    return `<button class="grow" data-u="${u}"><span class="gn">${esc(g.name)}</span>
      <span class="pp">${STAGES.map((s, i) => `<span class="${i < st ? "d" : i === st ? "n" : ""}">${i < st ? "✓" : ""}${s}</span>`).join("")}</span>
      <span class="tm">${st >= 5 ? "結案" : ""} <b>${fmt(usedTime(g))}</b></span><span class="hn">提示 <b>${totalHints(g)}</b></span></button>
      ${openRow === u ? `<div class="detail">${answers(g).map(([k, v]) => `<b>${k}</b>：${v}`).join("<br>") || "還沒有作答紀錄"}</div>` : ""}`;
  }).join("") || `<p class="empty">還沒有小組加入</p>`;
}
$("board").onclick = e => { const b = e.target.closest(".grow"); if (!b) return; openRow = openRow === b.dataset.u ? null : b.dataset.u; renderRun(); };
setInterval(() => {
  if (!meta || meta.state === "lobby") return;
  $("clock").textContent = fmt((meta.state === "open" ? db.serverNow() : meta.closedAt || db.serverNow()) - meta.startedAt);
  if (view === "run") document.querySelectorAll(".grow").forEach(b => {
    const g = groups[b.dataset.u]; if (g) b.querySelector(".tm b").textContent = fmt(usedTime(g));
  });
}, 1000);

// ── 作答紀錄翻成老師看得懂的話 ──
const LABELS = {
  tools: { _: "線索一試過的工具", stare: "盯著看", light: "換更亮的燈", cam: "放大拍下來" },
  why1: { _: "為什麼要拍下來", A: "存起來，之後比對、檢查", B: "瑕疵會變大", C: "畫面比較亮" },
  origin: { _: "晶片有原圖嗎", A: "有，事先設計好的", B: "沒有，每顆都不一樣", C: "拿隔壁晶片對照" },
  why2: { _: "為什麼有標準圖比較快", A: "只要找不一樣的地方", B: "標準圖會標出瑕疵", C: "比較熟練了" },
  computer: { _: "設定電腦", plain: "一般照片", zoom: "放大照片", std: "標準圖", eye: "眼睛" },
  why3: { _: "為什麼交給電腦", A: "太多會累，電腦不會累", B: "電腦比人聰明", C: "電腦不用放大也看得到" },
  report: { _: "流程排法" },
};
function tryText(key, raw) {
  const L = LABELS[key] || {}, parts = String(raw).split(">");
  const show = p => key === "computer" ? p.split("+").map(x => L[x] || x).join("＋") : key === "report" ? p.split("").join("→") : (L[p] || p);
  const final = show(parts[parts.length - 1]);
  const before = parts.slice(0, -1).map(show);
  return esc(final) + (before.length ? ` <span class="tries">（先試過：${esc(before.join("、"))}）</span>` : "");
}
function answers(g) {
  const a = g.ans || {}, out = [];
  if (a.open) out.push(["開場推理", `提出 ${esc(a.open)} 次才成立`]);
  for (const k of ["tools", "why1", "origin", "why2", "computer", "why3", "report"]) {
    if (a[k] == null) continue;
    out.push([LABELS[k]._, tryText(k, a[k]) + (a[k + "t"] ? `<br><span class="txt">「${esc(a[k + "t"])}」</span>` : "")]);
  }
  if (a.cmpSec != null) out.push(["有標準圖時", `每張 ${esc(a.cmpSec)} 秒`]);
  if (a.belt) out.push(["人工生產線", `抓到 ${esc(a.belt)} 顆壞晶片`]);
  return out;
}

// ── 結案報告 ──
function renderReport() {
  const list = Object.values(groups).sort((a, b) => (b.stage || 0) - (a.stage || 0));
  $("reports").innerHTML = list.map(g => `<div class="rep"><h3>${esc(g.name)}</h3>
    <div class="meta">${(g.stage || 0) >= 5 ? "✔ 已結案" : `停在「${STAGES[g.stage || 0]}」`}　用時 ${fmt(usedTime(g))}　提示 ${totalHints(g)} 次</div>
    <dl>${answers(g).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl></div>`).join("") || `<p class="empty">沒有小組</p>`;
}
$("btnBack").onclick = () => db.update(`cases/${code}/meta`, { state: "open" });

// ── 重新開始 ──
// 同一批小組重來：清掉各組的進度和作答，回到等待區（學生不用重新掃 QR code；證物數據保留）。
// round 加 1，學生端看到 round 變了就會清掉自己畫面上的進度。
async function restart() {
  if (!confirm("清掉各組的進度和作答，讓同一批小組從頭再玩一次？")) return;
  const up = { "meta/state": "lobby", "meta/startedAt": 0, "meta/closedAt": null, "meta/round": (meta.round || 0) + 1 };
  for (const u in groups) Object.assign(up, {
    [`groups/${u}/stage`]: 0, [`groups/${u}/times`]: null, [`groups/${u}/hints`]: null,
    [`groups/${u}/ans`]: null, [`groups/${u}/t`]: Math.round(db.serverNow()),
  });
  await db.update(`cases/${code}`, up);
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.dataset.act === "restart") restart();
  if (b.dataset.act === "new" && confirm("開一個新案件？各組要重新掃 QR code 加入。")) {
    // 舊案件先結束，還連在舊案件的平板才會看到「調查時間結束」，不會卡住
    db.update(`cases/${code}/meta`, { state: "closed", closedAt: Math.round(db.serverNow()) }).catch(() => {}).then(() => openCase(true));
  }
});

openCase().catch(e => {
  console.error(e);
  $("vBoot").innerHTML = `<p class="empty" style="text-align:center;margin-top:20vh">連不上資料庫。${db.usingFirebase ? "請確認 Firebase 的安全規則已經更新。" : "請確認有先執行 python3 server.py。"}</p>`;
});
</script>
</body>
</html>
